<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases Karaoke - Coro Canticorum</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

<div class="container">
    <h2>🎵 Karaoke Adaptativo por Palabras</h2>
    <p><strong>Coro Canticorum Bajos</strong></p>
    
    <div id="zona-seleccion">
        <label for="selector-cancion" style="display:block; margin-bottom:10px; color:#aaa;">Elige una pieza para ensayar:</label>
        <select id="selector-cancion" style="background:#2a2a30; color:#fff; border:2px solid #444; padding:10px; border-radius:8px; margin-bottom:15px; font-size:16px; width:100%;">
            <option value="Adeste">Adeste Fideles</option>
            <option value="No la debemos dormir">No la debemos dormir</option>
        </select>

        <div class="control-dificultad">
            <label style="color:#eee; font-size:15px; font-weight:600;">Exigencia de Afinación: <span id="txt-dificultad" style="color:#00b0ff;">Fácil (±45 cents) ☕</span></label>
            <input type="range" id="selector-dificultad" min="15" max="60" value="45" step="15" oninput="actualizarTextoDificultad(this.value)">
            <div class="etiquetas-rango">
                <span>Profesional</span>
                <span>Coral</span>
                <span>Fácil</span>
                <span>Muy Fácil</span>
            </div>
        </div>
    </div>

    <button id="btn-comenzar" onclick="iniciarApp()">Comenzar Entrenamiento</button>
    
    <div class="status-box" id="status-box" style="display: none;">
        <div class="navegacion-palabra">
            <button id="btn-anterior" class="btn-flecha" onclick="irAPalabraAnterior()" aria-label="Palabra anterior" title="Palabra anterior (←)" style="visibility:hidden">◀</button>
            <div id="palabra-pantalla" class="palabra-actual">...</div>
            <button id="btn-siguiente" class="btn-flecha" onclick="irAPalabraSiguiente()" aria-label="Palabra siguiente" title="Palabra siguiente (→)" style="visibility:hidden">▶</button>
        </div>
        <div id="secuencia-visual" class="secuencia-cajas"></div>

        <div id="evaluacion" style="margin-top: 15px; font-weight: bold; font-size: 18px; min-height: 25px;"></div>
        
        <div id="zona-reinicio" style="display: none;">
            <button class="btn-volver" onclick="regresarAlMenu()">⬅️ Volver a Selección</button>
        </div>
    </div>
</div>

    <!--cargamos el motor -->
    
    <script src="./app.js"></script>
</body>
</html>
